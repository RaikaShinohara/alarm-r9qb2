# Suspend does not come back on this phone yet: the default mode is "deep"
# (PSCI SYSTEM_SUSPEND) and after "PM: suspend entry (deep)" the phone stays
# dead (no screen, USB or SSH) until a forced reboot (docs/porting-log.md, Arch diary).
# s2idle is untested. Until it works, nothing may suspend: logind then reports
# CanSuspend=na and Plasma / the login screen do not offer or request it.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
