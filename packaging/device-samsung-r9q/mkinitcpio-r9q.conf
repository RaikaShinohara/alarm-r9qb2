# Galaxy S21 FE: UFS, its PHY, I2C, the MAX77705 and ext4 are built into the
# kernel, so the initramfs needs no storage or filesystem modules (like the
# pmOS one: ~14 MB vendor_boot). No autodetect: images are built in a
# container on the PC. modconf keeps qcrypto blacklisted from the start.
# gzip: the format pmOS used with this ABL.
MODULES=()
HOOKS=(base systemd modconf fsck)
COMPRESSION="gzip"
