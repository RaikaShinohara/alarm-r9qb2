# Phone power button. On the login screen nothing in Plasma takes the key
# (PowerDevil only inhibits it inside a session), so logind's default
# (HandlePowerKey=poweroff) shut the phone down on a short press; with the
# cable in, Samsung's ABL then boots again in charger mode. Short press: do
# nothing here (PowerDevil toggles the screen in a session, see powerdevilrc);
# holding it powers off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
# suspend does not come back on this phone (sleep.conf.d/10-r9q.conf)
HandleSuspendKey=ignore
HandleLidSwitch=ignore
