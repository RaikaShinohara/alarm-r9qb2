# How the S21 FE boots this system (r9q-bootimg):
#   BOOT_MODE=abl   Linux alone: boot.img/vendor_boot.img for Samsung's ABL,
#                   flashed to boot/vendor_boot; root on userdata
#   BOOT_MODE=uefi  dual boot with Android: kernel, initramfs and DTB on the
#                   ESP (/efi, systemd-boot entry "Arch Linux ARM"), started by
#                   the Mu-Silicium UEFI; boot/vendor_boot are Android's and
#                   are never written; root on the "linux" partition
BOOT_MODE=abl
# Kernel command line (in abl mode Samsung's ABL appends its androidboot.*
# options and forces console=null). Root is the ext4 written straight onto the
# partition (4K UFS sectors, no partition table inside).
CMDLINE="root=PARTLABEL=userdata rw rootwait clk_ignore_unused pd_ignore_unused regulator_ignore_unused panic=10 fbcon=font:TER16x32 panel_samsung_ea8082.refresh_rate=120 deferred_probe_timeout=60"
