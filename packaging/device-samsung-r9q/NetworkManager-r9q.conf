# usb0 is the USB networking gadget, configured by r9q-usb-gadget
[keyfile]
unmanaged-devices=interface-name:usb0

# From postmarketos-base-ui (50-random-mac.conf, 50-hostname-mode.conf).
# The Wi-Fi firmware reports Qualcomm's generic 00:03:7f:12:59:06 (the real
# MAC is in /efs/wifi/.mac.info, docs/porting-log.md diary 2026-10-31): random MAC while
# scanning and a stable one per network (derived from the machine-id), as
# Android does. Keep the hostname from /etc/hostname.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable

[main]
hostname-mode=none
