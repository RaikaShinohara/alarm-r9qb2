# Keep serving the EFS read-only, but never boot the modem (-s): it crashes
# right after boot (BADVA in the stock firmware) and that subsystem restart
# takes the sensor DSP (SLPI) down with it. Same drop-in as the pmOS device
# package; here it also guards against an rmtfs.service from another package.
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P
