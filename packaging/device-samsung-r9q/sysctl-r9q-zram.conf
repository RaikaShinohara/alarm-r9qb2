# zram tuning, same values as postmarketOS (zramstart): prefer compressing
# anonymous memory into zram over dropping the page cache and program code,
# no swap readahead (zram is RAM), and keep enough memory free for the kernel
# to start reclaiming into zram before the OOM killer fires.
vm.swappiness = 180
vm.page-cluster = 0
vm.min_free_kbytes = 100000
