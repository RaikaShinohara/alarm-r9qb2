# Compressed swap in RAM, as postmarketOS (postmarketos-zram) and Android do.
# Without it a game under Proton filled the ~5 GB the kernel sees, the kernel
# kept dropping and re-reading program code (everything got slower and slower)
# and the OOM killer finally killed the game (docs/porting-log.md, Arch diary).
# 150% of RAM with zstd, high priority: pmOS defaults.
[zram0]
zram-size = ram * 1.5
compression-algorithm = zstd
swap-priority = 300
