# Keep serving the EFS read-only, but do not boot the modem (-s) for now: it
# crashes right after boot (BADVA in the stock firmware) and that subsystem
# restart takes the sensor DSP (SLPI) down with it while it is still starting.
# Start it by hand with: echo start > /sys/class/remoteproc/remoteprocN/state
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P
