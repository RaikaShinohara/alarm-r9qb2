# The sensors live in the SLPI (SSC) and only show up once hexagonrpcd-sdsp
# has served it its registry, a few seconds after the fastrpc node appears.
# Started earlier, iio-sensor-proxy finds nothing and exits with success
# ("No sensors or missing kernel drivers"), and nothing starts it again:
# order it after hexagonrpcd and retry for about a minute.
[Unit]
Wants=hexagonrpcd-sdsp.service
After=hexagonrpcd-sdsp.service
StartLimitIntervalSec=120
StartLimitBurst=12

[Service]
Restart=on-success
RestartSec=5
