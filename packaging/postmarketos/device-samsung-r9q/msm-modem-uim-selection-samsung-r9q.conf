# The modem is not started on this port yet (rmtfs runs without -s, see
# rmtfs-no-modem-autostart.conf). msm-modem-uim-selection would then wait
# 45 s for a QRTR modem node that never appears, holding up every D-Bus
# activation of ModemManager - among them Plasma's network module in kded6
# at login, and with it plasmashell (a 30 s splash). Skip it, without
# failing, unless the modem remoteproc is running.
[Service]
ExecCondition=/bin/sh -c 'for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat "$r/name")" = modem ] && [ "$(cat "$r/state")" = running ] && exit 0; done; exit 1'
