# Bluetooth runs on the QCA6490 ROM firmware (no patch/NVM, see the
# APKBUILD), and bootmac's power off -> public-addr -> power on cycle leaves
# the controller hidden from mgmt for good ("Set Powered ... Invalid Index"),
# so BlueZ never sees an adapter. Keep the controller's own address
# (00:00:00:00:5A:AD, Samsung sets the real one through the NVM) and only do
# the useful part: an rfkill unblock, which also clears the HCI_RFKILLED flag
# the controller can be left with right after it registers (ERFKILL on power
# on), then power it on.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/sbin/rfkill unblock bluetooth; sleep 1; yes | /usr/sbin/btmgmt -i hci0 power on'
