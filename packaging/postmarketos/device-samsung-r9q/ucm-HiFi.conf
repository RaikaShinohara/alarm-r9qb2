# Samsung Galaxy S21 FE (r9q)
# Speakers: two CS35L41 amplifiers on primary MI2S, left slot = top speaker
# (earpiece), right slot = bottom speaker, both running Samsung's speaker
# protection firmware on their DSP.
# Microphones: two DMICs on the LPASS VA macro (VA_CODEC_DMA_TX_0 ->
# MultiMedia3), DMIC1 = bottom mic (left channel), DMIC3 = top mic (right).
#
# The routing lives in the verb: PulseAudio probes the PCMs with only the
# verb enabled, and a frontend without a backend route fails to open.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Top DSP1 Preload Switch' 1"
		cset "name='Bottom DSP1 Preload Switch' 1"
		# Samsung's protection firmware takes its audio from DSP RX2: feed it
		# each amplifier's own I2S slot (ASPRX1) as stock does. With RX2 on
		# ASPRX2 the top speaker played the left+right mix at half level and
		# the bottom one stayed silent.
		cset "name='Top DSP RX2 Source' ASPRX1"
		cset "name='Bottom DSP RX2 Source' ASPRX1"
		cset "name='Top PCM Source' DSP"
		cset "name='Bottom PCM Source' DSP"
		# Amplifier analog gain (0..20 = 0.5..20.5 dB; the driver starts at
		# 0.5 dB, Cirrus uses 17.5 dB with this protection firmware).
		cset "name='Top Analog PCM Volume' 6"
		cset "name='Bottom Analog PCM Volume' 6"

		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC3"
		# Decimator gain: 84 = 0 dB, 1 dB steps (Samsung records at 84)
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA_DEC1 Volume' 84"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
		CaptureChannels 2
	}
}
