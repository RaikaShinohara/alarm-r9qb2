# Samsung Galaxy S21 FE (r9q): the crypto engine (crypto@1dfa000 + its BAM DMA)
# belongs to TrustZone. With qcrypto bound the SoC freezes ~40 s later and the
# watchdog reboots the phone. Keep the crypto/cryptobam DT nodes enabled
# (disabling them makes every boot freeze) and only keep qcrypto out. Tested one by one (module by module, docs/porting-log.md row 13): qcom_stats,
# qcom_refgen_regulator, llcc_qcom, qcom_rng and qcomtee are fine.
blacklist qcrypto
