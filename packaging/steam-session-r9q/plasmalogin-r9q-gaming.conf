# Boot into Steam Big Picture (game mode), like ArmadaOS / SteamOS. The user
# is set in /etc/plasmalogin.conf.d/10-r9q-autologin.conf (image or package
# install); /etc/plasmalogin.conf.d/zz-r9q-session.conf (r9q-session-set)
# picks the other session until the next boot. Relogin: when a session ends,
# log in again into the chosen one (that is how game mode <-> desktop works).
[Autologin]
Relogin=true
Session=gamescope-session-steam.desktop
